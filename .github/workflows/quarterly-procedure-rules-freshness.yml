name: Quarterly Procedure Rules Freshness Check

on:
  # Runs at 08:00 UTC on January 1, April 1, July 1, and October 1
  schedule:
    - cron: '0 8 1 1,4,7,10 *'

  # Manual trigger from the Actions tab
  workflow_dispatch:

# Read-only checkout; issues:write only on the report job
permissions:
  contents: read

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Run the freshness check
  # Surfaces entries that are already stale (> 12 months since lastVerified)
  # or will become stale within the next 60 days.
  # ────────────────────────────────────────────────────────────────────────────
  check-freshness:
    name: Check Procedure Rules Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run procedure rules freshness check
        # Exit code 1 means stale entries exist — still upload the report
        run: npx tsx scripts/check-procedure-rules-freshness.ts --report
        continue-on-error: true

      - name: Upload freshness report
        uses: actions/upload-artifact@v4
        with:
          name: procedure-rules-freshness-report
          path: scripts/output/procedure-rules-freshness-report.json
          if-no-files-found: warn
          retention-days: 90

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Open a GitHub issue when stale or expiring-soon entries are found
  # ────────────────────────────────────────────────────────────────────────────
  report:
    name: Open Issue for Stale Entries
    runs-on: ubuntu-latest
    needs: check-freshness
    if: always() && !cancelled()
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download freshness report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: procedure-rules-freshness-report
          path: scripts/output

      - name: Open GitHub issue for stale or expiring-soon entries
        run: |
          REPORT="scripts/output/procedure-rules-freshness-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "No report file found — skipping issue creation."
            exit 0
          fi

          STALE_COUNT=$(node -e "
            const r = require('./$REPORT');
            console.log((r.summary || {}).stale || 0);
          " 2>/dev/null || echo "0")

          EXPIRING_COUNT=$(node -e "
            const r = require('./$REPORT');
            console.log((r.summary || {}).expiringSoon || 0);
          " 2>/dev/null || echo "0")

          if [ "$STALE_COUNT" = "0" ] && [ "$EXPIRING_COUNT" = "0" ]; then
            echo "All procedure rule entries are current. No issue needed."
            exit 0
          fi

          BODY=$(node -e "
            const r = require('./$REPORT');
            const stale = r.stale || [];
            const soon  = r.expiringSoon || [];
            const lines = [];

            lines.push('## Quarterly procedure rules freshness check');
            lines.push('');

            if (stale.length > 0) {
              lines.push('### ❌ Stale entries (' + stale.length + ') — re-verification required');
              lines.push('');
              lines.push('The vitest freshness guard in \`tests/jurisdiction-procedure-rules.test.ts\` **will fail in CI** until these are updated.');
              lines.push('');
              for (const e of stale) {
                lines.push('- \`' + e.key + '\`: lastVerified \`' + e.lastVerified + '\` (' + e.ageMonths + ' months old, ' + Math.abs(e.daysUntilStale) + ' days overdue)');
              }
              lines.push('');
            }

            if (soon.length > 0) {
              lines.push('### ⚠️ Expiring soon (' + soon.length + ') — re-verify before next quarter');
              lines.push('');
              for (const e of soon) {
                lines.push('- \`' + e.key + '\`: lastVerified \`' + e.lastVerified + '\` (' + e.ageMonths + ' months old, stale in ' + e.daysUntilStale + ' day' + (e.daysUntilStale === 1 ? '' : 's') + ')');
              }
              lines.push('');
            }

            lines.push('### How to fix');
            lines.push('');
            lines.push('1. Re-verify each entry against its cited statute or court rule.');
            lines.push('2. Update the \`lastVerified\` field in \`shared/jurisdiction-procedure-rules.ts\` to the current \`YYYY-MM\`.');
            lines.push('3. If the rule has changed, update the relevant fields and add a \`reformNote\` if appropriate.');
            lines.push('4. Run \`npx vitest run\` locally to confirm the freshness test passes.');
            console.log(lines.join('\n'));
          " 2>/dev/null || echo "Could not parse report.")

          TITLE_PARTS=""
          if [ "$STALE_COUNT" != "0" ]; then
            TITLE_PARTS="${STALE_COUNT} stale"
          fi
          if [ "$EXPIRING_COUNT" != "0" ]; then
            if [ -n "$TITLE_PARTS" ]; then
              TITLE_PARTS="${TITLE_PARTS}, ${EXPIRING_COUNT} expiring soon"
            else
              TITLE_PARTS="${EXPIRING_COUNT} expiring soon"
            fi
          fi

          gh issue create \
            --title "Quarterly check: procedure rules freshness — ${TITLE_PARTS}" \
            --body "$BODY" \
            --label "maintenance,content-accuracy"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

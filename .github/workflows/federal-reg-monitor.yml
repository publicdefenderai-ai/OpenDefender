name: Federal Regulatory Monitor

# Adapted from anthropics/claude-for-legal (Apache 2.0) © Anthropic PBC
# Watches DOJ, BOP, DEA, EOIR federal regulatory feeds and USSC/BJS pages
# for changes relevant to criminal law, sentencing, and public defense.
# Opens a GitHub issue when material items are found for human review.

on:
  # Runs at 09:00 UTC on the 1st of each month
  schedule:
    - cron: '0 9 1 * *'

  # Manual trigger
  workflow_dispatch: {}

permissions:
  contents: read

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Check federal regulatory feeds
  # ─────────────────────────────────────────────────────────────────────────────
  check-feeds:
    name: Check Federal Regulatory Feeds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Restore HEAD-check state from previous run (tracks ETag/Last-Modified values)
      - name: Restore HEAD-check state
        uses: actions/cache@v4
        with:
          path: scripts/reg-monitor/output/head-check-state.json
          key: reg-monitor-state-${{ runner.os }}
          restore-keys: reg-monitor-state-

      - name: Run regulatory monitor
        id: monitor
        run: |
          set +e
          npx tsx scripts/reg-monitor/federal-reg-monitor.ts
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 1 ]; then
            echo "material_found=true" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "material_found=false" >> $GITHUB_OUTPUT
          else
            echo "Monitor script failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      # Save updated HEAD-check state for next run
      - name: Save HEAD-check state
        uses: actions/cache@v4
        with:
          path: scripts/reg-monitor/output/head-check-state.json
          key: reg-monitor-state-${{ runner.os }}-${{ github.run_id }}

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: reg-monitor-digest
          path: scripts/reg-monitor/output/digest-*.json
          if-no-files-found: warn
          retention-days: 90

    outputs:
      material_found: ${{ steps.monitor.outputs.material_found }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Create GitHub issue if material items found
  # ─────────────────────────────────────────────────────────────────────────────
  create-issue:
    name: Create Review Issue
    runs-on: ubuntu-latest
    needs: check-feeds
    if: needs.check-feeds.outputs.material_found == 'true'
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download digest
        uses: actions/download-artifact@v4
        with:
          name: reg-monitor-digest
          path: scripts/reg-monitor/output

      - name: Create GitHub issue
        run: npx tsx scripts/reg-monitor/generate-issue.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

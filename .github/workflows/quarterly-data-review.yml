name: Quarterly Data Review

on:
  # Runs at 08:00 UTC on January 1, April 1, July 1, and October 1
  schedule:
    - cron: '0 8 1 1,4,7,10 *'

  # Allow manual trigger from the Actions tab with optional category filter
  workflow_dispatch:
    inputs:
      category:
        description: 'Which category to check (leave blank for all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - detention-facilities
          - consulates
          - legal-aid
          - federal-statutes
          - public-defenders
          - charge-citations
          - procedure-rules

# Default: read-only. The verify-charge-citations job needs contents:write to
# commit promoted citations back to main. generate-report needs issues:write.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Job 1: ICE Detention Facilities
  # ──────────────────────────────────────────────────────────────────────────────
  check-detention-facilities:
    name: Check ICE Detention Facilities
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.category == 'all' ||
      github.event.inputs.category == 'detention-facilities'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run detention facility checker
        run: npx tsx scripts/data-review/check-detention-facilities.ts

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: detention-diff
          path: scripts/data-review/output/detention-diff.json
          if-no-files-found: error
          retention-days: 7

      # ── Hotline & phone number verification ─────────────────────────────────
      # Runs scripts/check-detention-facilities.ts, which:
      #   (1) HEAD-checks the ICE Online Detainee Locator URL and reference pages
      #   (2) Fetches ice.gov/contact/ero and immigrantjustice.org/contact and
      #       scans for the two hardcoded hotlines: 1-888-351-4024 (ICE ERO) and
      #       312-660-1370 (NIJC). Exits 1 if either number is absent/unconfirmed.
      #   (3) Generates a full manual-review table of all 27 facility records
      #       (30 phone numbers) grouped by state for cross-check against
      #       ice.gov/detention-facilities.
      # Phone numbers cannot be verified programmatically. The artifact output
      # (detention-facilities-report.json) is the checklist for manual review.
      # A reviewer should call or check each facility number at least quarterly.
      - name: Verify detention hotlines and generate phone review checklist
        run: npx tsx scripts/check-detention-facilities.ts --report
        # Exit code 1 means a hotline number was not found on its source page —
        # flag it, but still upload the artifact so reviewers have the full list.
        continue-on-error: true

      - name: Upload hotline and phone number review report
        uses: actions/upload-artifact@v4
        with:
          name: detention-phone-report
          path: scripts/output/detention-facilities-report.json
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2: Consulate Information
  # ──────────────────────────────────────────────────────────────────────────────
  check-consulates:
    name: Check Consulate Information
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.category == 'all' ||
      github.event.inputs.category == 'consulates'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run consulate checker
        run: npx tsx scripts/data-review/check-consulates.ts

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: consulate-diff
          path: scripts/data-review/output/consulate-diff.json
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 3: Legal Aid Organizations
  # ──────────────────────────────────────────────────────────────────────────────
  check-legal-aid:
    name: Check Legal Aid Organizations
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.category == 'all' ||
      github.event.inputs.category == 'legal-aid'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run legal aid checker
        run: npx tsx scripts/data-review/check-legal-aid.ts

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: legal-aid-diff
          path: scripts/data-review/output/legal-aid-diff.json
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 4: Federal Statutes URL Verification
  # ──────────────────────────────────────────────────────────────────────────────
  check-federal-statutes:
    name: Check Federal Statute URLs
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.category == 'all' ||
      github.event.inputs.category == 'federal-statutes'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run federal statute URL checker
        run: npx tsx scripts/data-review/check-federal-statutes.ts

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: statutes-diff
          path: scripts/data-review/output/statutes-diff.json
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 5: Public Defender Office Verification
  # ──────────────────────────────────────────────────────────────────────────────
  check-public-defenders:
    name: Check Public Defender Offices
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.category == 'all' ||
      github.event.inputs.category == 'public-defenders'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run public defender office checker
        run: npx tsx scripts/data-review/check-public-defenders.ts

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-defenders-diff
          path: scripts/data-review/output/public-defenders-diff.json
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 6: Criminal Charge Citation Verification (OpenLaws API)
  # Verifies statute citations in criminal-charges.ts via OpenLaws API.
  # Only entries with statuteCitations[] populated are checked; entries without
  # citations are counted as 'pending' and do not cause failures.
  # ──────────────────────────────────────────────────────────────────────────────
  verify-charge-citations:
    name: Verify Criminal Charge Citations
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.category == 'all' ||
      github.event.inputs.category == 'charge-citations'
    permissions:
      contents: write  # needed to commit promoted citations back to main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run charge citation verifier
        run: npx tsx scripts/data-review/verify-charge-citations.ts
        env:
          OPENLAWS_API_KEY: ${{ secrets.OPENLAWS_API_KEY }}
          OPENLAWS_API_URL: ${{ secrets.OPENLAWS_API_URL }}
        # Allow failure: not_found/repealed exits 1, but we still want the artifact
        # and report. The report generator will surface the issue.
        continue-on-error: true

      - name: Promote verified citations to high confidence
        run: npx tsx scripts/data-review/promote-verified-citations.ts

      - name: Commit promoted citations (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet shared/criminal-charge-citations.ts; then
            echo "No citations promoted — overlay file unchanged."
          else
            PROMOTED=$(git diff --unified=0 shared/criminal-charge-citations.ts | grep '^+' | grep -c '"high"' || true)
            git add shared/criminal-charge-citations.ts
            git commit -m "Promote ${PROMOTED} verified citation(s) to high confidence [quarterly review]"
            git push origin main
            echo "Committed and pushed ${PROMOTED} promotion(s)."
          fi

      - name: Upload charge citations report
        uses: actions/upload-artifact@v4
        with:
          name: charge-citations-report
          path: scripts/data-review/output/charge-citations-report.json
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 7: Procedure Rules Freshness Check
  # Reads JURISDICTION_PROCEDURE_RULES and fails if any entry's lastVerified
  # date is more than 12 months in the past.
  # ──────────────────────────────────────────────────────────────────────────────
  check-procedure-rules:
    name: Check Procedure Rules Freshness
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.category == 'all' ||
      github.event.inputs.category == 'procedure-rules'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run procedure rules freshness checker
        run: npx tsx scripts/data-review/check-procedure-rules.ts

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: procedure-rules-diff
          path: scripts/data-review/output/procedure-rules-diff.json
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 8: Generate Report & Create GitHub Issue
  # Runs after all checkers complete, even if some were skipped.
  # ──────────────────────────────────────────────────────────────────────────────
  generate-report:
    name: Generate Review Report
    runs-on: ubuntu-latest
    needs: [check-detention-facilities, check-consulates, check-legal-aid, check-federal-statutes, check-public-defenders, verify-charge-citations, check-procedure-rules]
    # Run even if some checker jobs were skipped (due to category filter)
    if: always() && !cancelled()
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Download each artifact separately with continue-on-error so that a
      # skipped or failed checker job doesn't block report generation.
      - name: Download detention-facilities diff
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: detention-diff
          path: scripts/data-review/output

      - name: Download detention hotline and phone review report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: detention-phone-report
          path: scripts/output

      - name: Download consulates diff
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: consulate-diff
          path: scripts/data-review/output

      - name: Download legal-aid diff
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: legal-aid-diff
          path: scripts/data-review/output

      - name: Download statutes diff
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: statutes-diff
          path: scripts/data-review/output

      - name: Download public-defenders diff
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: public-defenders-diff
          path: scripts/data-review/output

      - name: Download charge citations report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: charge-citations-report
          path: scripts/data-review/output

      - name: Download procedure rules freshness diff
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: procedure-rules-diff
          path: scripts/data-review/output

      - name: Create GitHub Issue
        run: npx tsx scripts/data-review/generate-report.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

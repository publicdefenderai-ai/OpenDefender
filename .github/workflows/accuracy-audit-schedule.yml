name: Monthly Accuracy Audit

on:
  schedule:
    # 1st of every month at 9 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  create-accuracy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create accuracy audit issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUDITS_REPO_TOKEN }}
          script: |
            const now = new Date();
            const month = now.toLocaleString('default', { month: 'long', year: 'numeric' });
            const monthNum = now.getMonth() + 1;

            // Quarterly breakdown: Each quarter (3 months) covers one category
            // Each month within the quarter covers one audit focus
            const auditSchedule = {
              1: { category: 'Employment & Finances', focus: 'URLs & Broken Links', detail: 'Verify all resource URLs are live and no 404s exist' },
              2: { category: 'Employment & Finances', focus: 'Contact Info & Descriptions', detail: 'Verify contact info (addresses, hours, eligibility) and resource descriptions are current' },
              3: { category: 'Employment & Finances', focus: 'Statute Citations', detail: 'Verify all statute citations and legal content are accurate and current' },
              4: { category: 'Housing & Transportation', focus: 'URLs & Broken Links', detail: 'Verify all resource URLs are live and no 404s exist' },
              5: { category: 'Housing & Transportation', focus: 'Contact Info & Descriptions', detail: 'Verify contact info (addresses, hours, eligibility) and resource descriptions are current' },
              6: { category: 'Housing & Transportation', focus: 'Statute Citations', detail: 'Verify all statute citations and legal content are accurate and current' },
              7: { category: 'Mental Health, Childcare & Other', focus: 'URLs & Broken Links', detail: 'Verify all resource URLs are live and no 404s exist' },
              8: { category: 'Mental Health, Childcare & Other', focus: 'Contact Info & Descriptions', detail: 'Verify contact info (addresses, hours, eligibility) and resource descriptions are current' },
              9: { category: 'Mental Health, Childcare & Other', focus: 'Statute Citations', detail: 'Verify all statute citations and legal content are accurate and current' },
              10: { category: 'Court Logistics', focus: 'URLs & Broken Links', detail: 'Verify all resource URLs are live and no 404s exist' },
              11: { category: 'Court Logistics', focus: 'Contact Info & Descriptions', detail: 'Verify contact info (addresses, hours, eligibility) and resource descriptions are current' },
              12: { category: 'Court Logistics', focus: 'Statute Citations', detail: 'Verify all statute citations and legal content are accurate and current' }
            };

            const audit = auditSchedule[monthNum];
            const { category, focus, detail } = audit;

            try {
              const issue = await github.rest.issues.create({
                owner: 'publicdefenderai-ai',
                repo: 'OpenDefender-audits',
                title: `Accuracy Audit — ${category} | ${focus} (${month})`,
                body: `## Category\n${category}\n\n## Focus This Month\n${focus}\n\n${detail}\n\n## Audit Month\n${month}\n\n## Checklist\n- [ ] All items in this category checked against this month's focus\n- [ ] Found items are accurate and current\n- [ ] No broken links or dead resources (URLs focus)\n- [ ] Contact info matches live sources (contact info focus)\n- [ ] Citations match source documents (citations focus)\n\n## Findings\n\n| Item | Status | Notes |\n|-----|--------|-------|\n| | ✓ Accurate / ✗ Broken / ? Stale | |\n\n## Issues to Create\n[Link any PRs/issues for fixing findings]`,
                labels: ['accuracy-audit'],
                assignees: []
              });
              console.log('Created audit issue:', issue.data.html_url);
            } catch (error) {
              console.error('Error creating audit issue:', error);
              throw error;
            }

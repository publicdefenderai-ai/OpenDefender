name: Monthly Accuracy Audit

on:
  schedule:
    # 1st of every month at 9 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  create-accuracy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine audit category
        id: category
        run: |
          month=$(date +%m)
          case $month in
            1|4|7|10)
              echo "category=Employment & Finances" >> $GITHUB_OUTPUT
              echo "category_slug=employment-finances" >> $GITHUB_OUTPUT
              ;;
            2|5|8|11)
              echo "category=Housing & Transportation" >> $GITHUB_OUTPUT
              echo "category_slug=housing-transportation" >> $GITHUB_OUTPUT
              ;;
            3|6|9|12)
              echo "category=Mental Health, Childcare & Other" >> $GITHUB_OUTPUT
              echo "category_slug=mental-health-childcare-other" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Create accuracy audit issue
        uses: actions/github-script@v7
        env:
          AUDIT_CATEGORY: ${{ steps.category.outputs.category }}
        with:
          github-token: ${{ secrets.AUDITS_REPO_TOKEN }}
          script: |
            const month = new Date().toLocaleString('default', { month: 'long', year: 'numeric' });
            const category = process.env.AUDIT_CATEGORY;
            try {
              const issue = await github.rest.issues.create({
                owner: 'publicdefenderai-ai',
                repo: 'OpenDefender-audits',
                title: `Accuracy Audit — ${category} (${month})`,
                body: `## Category\n${category}\n\n## Audit Month\n${month}\n\n## Audit Checklist\n- [ ] All resource URLs verified (live + content accurate)\n- [ ] Statute citations verified\n- [ ] Contact info current (addresses, hours, eligibility)\n- [ ] Resource descriptions match live websites\n- [ ] No broken links or 404s\n\n## Findings\n[See issue template: accuracy-audit.md]\n\n| URL / Item | Status | Notes |\n|-----|--------|-------|\n| | ✓ Accurate / ✗ Broken / ? Stale | |\n\n## Issues to Create\n[Link any PRs/issues for fixing findings]`,
                labels: ['accuracy-audit'],
                assignees: []
              });
              console.log('Created audit issue:', issue.data.html_url);
            } catch (error) {
              console.error('Error creating audit issue:', error);
              throw error;
            }

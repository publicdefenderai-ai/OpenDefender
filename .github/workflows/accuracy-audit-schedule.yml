name: Monthly Accuracy Audit

on:
  schedule:
    # 1st of every month at 9 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  create-accuracy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create accuracy audit issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUDITS_REPO_TOKEN }}
          script: |
            const now = new Date();
            const month = now.toLocaleString('default', { month: 'long', year: 'numeric' });
            const monthNum = String(now.getMonth() + 1).padStart(2, '0');

            let category, focus, detail;
            if (['01', '04', '07', '10'].includes(monthNum)) {
              category = 'Employment & Finances';
              focus = 'URLs & Broken Links';
              detail = 'Verify all resource URLs are live and no 404s exist';
            } else if (['02', '05', '08', '11'].includes(monthNum)) {
              category = 'Housing & Transportation';
              focus = 'Contact Info & Descriptions';
              detail = 'Verify contact info (addresses, hours, eligibility) and resource descriptions are current';
            } else {
              category = 'Mental Health, Childcare & Other';
              focus = 'Statute Citations';
              detail = 'Verify all statute citations and legal content are accurate and current';
            }

            try {
              const issue = await github.rest.issues.create({
                owner: 'publicdefenderai-ai',
                repo: 'OpenDefender-audits',
                title: `Accuracy Audit — ${category} | ${focus} (${month})`,
                body: `## Category\n${category}\n\n## Focus This Month\n${focus}\n\n${detail}\n\n## Audit Month\n${month}\n\n## Checklist\n- [ ] All items in this category checked against this month's focus\n- [ ] Found items are accurate and current\n- [ ] No broken links or dead resources (URLs focus)\n- [ ] Contact info matches live sources (contact info focus)\n- [ ] Citations match source documents (citations focus)\n\n## Findings\n\n| Item | Status | Notes |\n|-----|--------|-------|\n| | ✓ Accurate / ✗ Broken / ? Stale | |\n\n## Issues to Create\n[Link any PRs/issues for fixing findings]`,
                labels: ['accuracy-audit'],
                assignees: []
              });
              console.log('Created audit issue:', issue.data.html_url);
            } catch (error) {
              console.error('Error creating audit issue:', error);
              throw error;
            }

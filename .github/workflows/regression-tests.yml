name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vitest Regression Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify local test tools
        run: |
          test -x node_modules/.bin/vitest
          test -x node_modules/.bin/playwright

      - name: Configure disposable PostgreSQL test tools
        run: |
          # Ubuntu ships versioned server binaries outside the default PATH.
          pg_bin="$(pg_config --bindir)"
          for tool in initdb pg_ctl psql createdb; do
            test -x "$pg_bin/$tool" || { echo "::error::Missing PostgreSQL test tool: $tool"; exit 1; }
          done
          echo "$pg_bin" >> "$GITHUB_PATH"

      - name: Run regression tests
        run: ./node_modules/.bin/vitest run tests/

      - name: Check procedure-rules freshness
        run: npx tsx scripts/check-procedure-rules-freshness.ts

  release-readiness:
    name: Production Release Readiness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify local test tools
        run: |
          test -x node_modules/.bin/vitest
          test -x node_modules/.bin/playwright

      - name: Install Chromium for browser checks
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Verify production release artifact and moderate-or-higher dependency audit
        run: npm run release:verify
